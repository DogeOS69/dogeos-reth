[workspace]
members = ["bin/dogeos-reth", "crates/dogeos-chainspec", "crates/dogeos-hardforks", "crates/dogeos-protocol-types", "crates/dogeos-reth-consensus", "crates/dogeos-reth-engine", "crates/dogeos-reth-evm", "crates/dogeos-reth-node", "crates/dogeos-reth-payload", "crates/dogeos-reth-primitives", "crates/dogeos-reth-rpc", "crates/dogeos-reth-spike", "crates/dogeos-reth-txpool", "crates/dogeos-rpc-types", "crates/dogeos-scroll-wire"]
default-members = ["bin/dogeos-reth", "crates/dogeos-chainspec", "crates/dogeos-hardforks", "crates/dogeos-protocol-types", "crates/dogeos-reth-consensus", "crates/dogeos-reth-engine", "crates/dogeos-reth-evm", "crates/dogeos-reth-node", "crates/dogeos-reth-payload", "crates/dogeos-reth-primitives", "crates/dogeos-reth-rpc", "crates/dogeos-reth-spike", "crates/dogeos-reth-txpool", "crates/dogeos-rpc-types", "crates/dogeos-scroll-wire"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DogeOS69/dogeos-reth"

[workspace.dependencies]
# Official Reth v2.0.0 plus the reviewed RocksDB, header-transform, and composite-RPC
# compatibility stack. This is a source dependency, not a copied upstream workspace.
reth-ethereum = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-ethereum-cli = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-cli = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-node-builder = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-node-types = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-chainspec = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-consensus = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-consensus-common = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-ethereum-forks = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-network-peers = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-network = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-network-api = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-eth-wire = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-trie-common = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-evm = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-execution-types = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-engine-primitives = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-engine-local = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-payload-primitives = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-storage-api = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-tasks = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-basic-payload-builder = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-errors = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-execution-cache = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-payload-builder-primitives = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-provider = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-db-api = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-revm = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc-convert = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc-builder = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc-eth-api = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc-eth-types = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-rpc-traits = { version = "=0.1.1", default-features = false }
reth-storage-errors = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }
reth-transaction-pool = { git = "https://github.com/DogeOS69/reth.git", rev = "ae160090003d9b04be0521e9e4760558798cdf40", default-features = false }

# The Reth 2.0 dependency family. Exact resolution is checked in CI below.
alloy-consensus = { version = "=1.8.2", default-features = false }
alloy-chains = { version = "0.2.34", default-features = false }
alloy-eips = { version = "1.8.2", default-features = false }
alloy-network = { version = "1.8.2", default-features = false }
alloy-network-primitives = { version = "1.8.2", default-features = false }
alloy-genesis = { version = "1.8.2", default-features = false }
alloy-json-rpc = { version = "=1.8.3", default-features = false }
alloy-evm = { version = "=0.30.0", default-features = false }
alloy-hardforks = { version = "=0.4.7", default-features = false }
alloy-primitives = { version = "=1.5.7", default-features = false }
alloy-rpc-types-engine = { version = "=1.8.2", default-features = false }
alloy-rpc-types-eth = { version = "=1.8.2", default-features = false }
alloy-rpc-types-debug = { version = "=1.8.3", default-features = false }
alloy-rpc-client = { version = "=1.8.3", default-features = false }
alloy-rlp = { version = "0.3.13", default-features = false, features = ["core-net"] }
alloy-serde = { version = "1.8.2", default-features = false }
alloy-transport = { version = "=1.8.3", default-features = false }
alloy-transport-http = { version = "=1.8.3", default-features = false }
jsonrpsee = { version = "0.26", features = ["server"] }
revm = { version = "=36.0.0", default-features = false }

# Shared utility dependencies used by DogeOS-owned protocol crates.
auto_impl = "1"
arbitrary = "1.3"
bincode = "1.3"
bytes = { version = "1.11.1", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
derive_more = { version = "2", default-features = false, features = ["full"] }
modular-bitfield = "0.13.1"
once_cell = { version = "1.19", default-features = false, features = ["critical-section"] }
parking_lot = "0.12"
proptest = "1.7"
proptest-arbitrary-interop = "0.1.0"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
reth-codecs = "=0.1.1"
reth-codecs-derive = "=0.1.1"
reth-primitives-traits = { version = "=0.1.1", default-features = false }
reth-zstd-compressors = { version = "=0.1.1", default-features = false }
rstest = "0.26.1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
serde_with = { version = "3", default-features = false, features = ["macros"] }
encoder-standard = { git = "https://github.com/scroll-tech/da-codec", rev = "54929786434f00efd00431517a332f1ec8ca58d4", default-features = false }
eyre = "0.6"
either = { version = "1", default-features = false }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
tokio-stream = "0.1"
tracing = { version = "0.1", default-features = false }

# DogeOS-owned crates.
dogeos-protocol-types = { path = "crates/dogeos-protocol-types", default-features = false }
dogeos-hardforks = { path = "crates/dogeos-hardforks", default-features = false }
dogeos-chainspec = { path = "crates/dogeos-chainspec", default-features = false }
dogeos-reth-primitives = { path = "crates/dogeos-reth-primitives", default-features = false }
dogeos-reth-engine = { path = "crates/dogeos-reth-engine", default-features = false }
dogeos-reth-payload = { path = "crates/dogeos-reth-payload", default-features = false }
dogeos-reth-evm = { path = "crates/dogeos-reth-evm", default-features = false }
dogeos-reth-consensus = { path = "crates/dogeos-reth-consensus", default-features = false }
dogeos-reth-txpool = { path = "crates/dogeos-reth-txpool", default-features = false }
dogeos-reth-rpc = { path = "crates/dogeos-reth-rpc", default-features = false }
dogeos-reth-node = { path = "crates/dogeos-reth-node", default-features = false }
dogeos-rpc-types = { path = "crates/dogeos-rpc-types", default-features = false }
dogeos-scroll-wire = { path = "crates/dogeos-scroll-wire", default-features = false }

# DogeOS-owned EVM behavior is retained outside upstream Reth. This revision
# comes from the REVM 36 upgrade branch.
revm-scroll = { git = "https://github.com/DogeOS69/dogeos-revm.git", branch = "chore/upgrade-revm-v36", default-features = false }
