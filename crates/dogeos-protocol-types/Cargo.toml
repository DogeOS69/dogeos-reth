[package]
name = "dogeos-protocol-types"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91.0"
license.workspace = true
publish = false

[dependencies]
# Alloy's protocol traits are semver-compatible across the supported consumer
# range. Keep this Reth-free crate independent from the exact versions selected
# by the surrounding Reth workspace so downstream applications can use their
# own compatible Alloy patch releases.
alloy-rlp = { version = "0.3", default-features = false }
alloy-eips = { version = "1.6", default-features = false }
alloy-consensus = { version = "1.6", default-features = false }
alloy-primitives = { version = "1.5", default-features = false, features = ["rlp"] }

# misc
derive_more = { workspace = true, features = ["display"] }
bytes = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

# arbitrary
arbitrary = { workspace = true, features = ["derive"], optional = true }

reth-codecs = { workspace = true, optional = true }
reth-codecs-derive = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, optional = true }

# required by reth-codecs
modular-bitfield = { workspace = true, optional = true }

# serde
alloy-serde = { version = "1.6", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
rand.workspace = true
bincode.workspace = true
serde_json.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
alloy-primitives = { workspace = true, features = ["rand", "arbitrary"] }
reth-codecs = { workspace = true, features = ["test-utils"] }
reth-codecs-derive.workspace = true
modular-bitfield.workspace = true
proptest-arbitrary-interop.workspace = true
proptest.workspace = true

[features]
default = ["std"]
std = [
    "serde/std",
    "alloy-primitives/std",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-rlp/std",
    "alloy-serde/std",
    "proptest/std",
    "rand/std",
    "derive_more/std",
    "serde_json/std",
    "serde_with?/std",
]
k256 = [
    "alloy-primitives/k256",
    "alloy-consensus/k256",
]
kzg = [
    "alloy-eips/kzg",
    "alloy-consensus/kzg",
    "std",
]
reth-codec = [
    "dep:reth-codecs",
    "dep:reth-codecs-derive",
    "dep:bytes",
    "modular-bitfield",
    "std",
    "reth-codecs/std",
    "reth-codecs/serde",
]
reth-compat = [
    "dep:reth-primitives-traits",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-serde/arbitrary",
    "alloy-primitives/rand",
]
serde = [
    "dep:serde",
    "dep:alloy-serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "rand/serde",
]
serde-bincode-compat = [
    "dep:serde_with",
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
