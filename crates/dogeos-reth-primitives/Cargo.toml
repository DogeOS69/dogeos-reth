[package]
name = "dogeos-reth-primitives"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# reth
reth-codecs = { workspace = true, optional = true }
reth-primitives-traits.workspace = true
reth-zstd-compressors = { workspace = true, optional = true }

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true

# scroll
dogeos-protocol-types.workspace = true

# codec
bytes = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# misc
once_cell.workspace = true

# test
arbitrary = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
reth-codecs = { workspace = true, features = ["test-utils"] }
rstest.workspace = true
rand.workspace = true

[features]
default = ["std"]
std = [
    "serde?/std",
    "dogeos-protocol-types/std",
    "dogeos-protocol-types/k256",
    "dogeos-protocol-types/reth-compat",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "bytes?/std",
    "reth-primitives-traits/std",
    "reth-zstd-compressors?/std",
    "reth-codecs?/std",
    "once_cell/std",
]
reth-codec = [
    "dep:reth-codecs",
    "std",
    "reth-primitives-traits/reth-codec",
    "dogeos-protocol-types/reth-codec",
    "dep:bytes",
    "dep:modular-bitfield",
    "dep:reth-zstd-compressors",
]
serde = [
    "dep:serde",
    "dogeos-protocol-types/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "reth-codecs?/serde",
    "reth-primitives-traits/serde",
    "rand/serde",
]
arbitrary = [
    "dep:arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "reth-codecs?/arbitrary",
    "reth-primitives-traits/arbitrary",
    "dogeos-protocol-types/arbitrary",
]
