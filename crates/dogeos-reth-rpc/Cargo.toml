[package]
name = "dogeos-reth-rpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-json-rpc.workspace = true
alloy-primitives.workspace = true
alloy-rpc-client = { workspace = true, features = ["reqwest", "ws"] }
alloy-rpc-types-debug.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rlp.workspace = true
alloy-transport.workspace = true
alloy-transport-http = { workspace = true, features = ["reqwest"] }
dogeos-protocol-types = { workspace = true, features = ["std"] }
dogeos-hardforks = { workspace = true, features = ["std"] }
dogeos-reth-evm = { workspace = true, features = ["std"] }
dogeos-reth-primitives = { workspace = true, features = ["reth-codec", "serde", "std"] }
dogeos-rpc-types = { workspace = true, features = ["reth", "std"] }
reth-errors.workspace = true
reth-chainspec = { workspace = true, features = ["std"] }
reth-evm.workspace = true
reth-primitives-traits = { workspace = true, features = ["std"] }
reth-rpc-convert.workspace = true
reth-revm.workspace = true
reth-rpc.workspace = true
reth-rpc-eth-api.workspace = true
reth-rpc-eth-types.workspace = true
reth-storage-api = { workspace = true, features = ["std"] }
reqwest.workspace = true
revm.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["std"]
std = []
